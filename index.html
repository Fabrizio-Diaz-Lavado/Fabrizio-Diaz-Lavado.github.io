<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify - Landing page</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <span class="brand">Spotify</span>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="titulo-principal">
      <div class="hero-content">
        <h1 id="titulo-principal">Música para todos.</h1>
        <p class="subtitle">Millones de canciones. Sin tarjeta de crédito.</p>
      </div>

      <div class="hero-action">
        <button type="button" class="btn-primary" id="btn-registro">
          Regístrate gratis
        </button>
        <p id="mensaje" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
</body>
</html>
